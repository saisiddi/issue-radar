# issue-radar configuration.
# This tool only reads issues and sends alerts. It never comments, assigns,
# labels, or opens PRs on any watched repo.

# Your own GitHub login. Issues you authored are never alerted on in poll,
# and are listed under a separate "My issues" section in sweep reports.
my_username: saisiddi

# Each repo below can optionally override the global positive_keywords,
# negative_keywords, claim_phrases, and reserved_labels (set further down)
# by adding the same field directly on the repo entry - see "Adding a new
# repo" in README.md for an example. Omitted fields inherit the global
# default; an explicit list (even []) replaces it entirely.
repos:
  - name: OWASP/Nettacker
    org: OWASP
    reviewers: [securestep9, arkid15r]
    requires_assignment: true

  - name: GreedyBear-Project/GreedyBear
    org: Honeynet
    reviewers: [regulartim]
    requires_assignment: true

  - name: intelowlproject/IntelOwl
    org: Honeynet
    # mlodic is stepping down after GSoC 2026; successor unknown as of writing.
    reviewers: [mlodic]
    requires_assignment: true

  - name: openwisp/openwisp-firmware-upgrader
    org: OpenWISP
    reviewers: [nemesifier, pandafy]
    requires_assignment: false
    reserve: true
    # OpenWISP reserves GSoC-idea issues with this label specifically.
    reserved_labels: [gsoc-idea]

  - name: openwisp/netjsonconfig
    org: OpenWISP
    reviewers: [nemesifier, pandafy]
    requires_assignment: true
    # OpenWISP reserves GSoC-idea issues with this label specifically.
    reserved_labels: [gsoc-idea]

# Keywords used by triage.fit_tag. Matching is case-insensitive against
# issue labels, title, and body.
skills:
  positive_keywords:
    - python
    - django
    - bug
    - security
    - scanner
    - module
    - yaml
    - test
    - api
  negative_keywords:
    - react
    - frontend
    - css
    - ui
    - javascript-only
    - translation

# Substrings (case-insensitive) that flag a comment - or, on the issue's own
# body, the reporter themselves (see author_self_claim) - as a claim attempt.
claim_phrases:
  - "assign me"
  - "can i work"
  - "i'd like to work"
  - "i would like to work"
  - "i'll take"
  - "i will take"
  - "i'll take this"
  - "i can work on this"
  - "i can work on"
  - "i can implement this"
  - "happy to submit a pr"
  - "happy to take"
  - "i can take"
  - "i want to take"
  - "happy to work on"
  - "please assign"
  - "may i work"
  - "i can make"
  - "submit a pr"
  - "i can submit"
  - "i can open a pr"
  - "i'll submit"
  - "i'd be happy to"
  - "i would like to be assigned"
  - "could you assign"
  - "assign this"
  - "i have prepared a patch"
  - "i have a version ready"
  - "could this be assigned to me"
  - "can this be assigned to me"

# Labels that mark an issue as reserved for an active program (e.g. GSoC) and
# therefore DISCUSS-ONLY rather than something to alert on as free to claim.
reserved_labels:
  - gsoc-idea
  - gsoc
  - do-not-work-on
  - reserved

# An issue with no activity for this many days is considered stale.
staleness_days_threshold: 30

notifier:
  # One of: telegram, discord
  type: telegram
  # When true, alerts are printed to the terminal instead of sent.
  # Overridden by the --dry-run CLI flag regardless of this value.
  dry_run: false

# Optional LLM-generated 2-sentence summary of "what is this issue asking".
# Never used for status or fit_tag decisions. Skipped entirely if enabled
# but no API key is present in the environment.
llm:
  enabled: false
  provider: null
  model: null

state_file: state.json
# Base filename for sweep reports. Each repo gets its own file:
# sweep_report.md -> sweep_report_<owner>_<repo>.md, so sweeping multiple
# repos in separate runs never overwrites an earlier repo's report.
sweep_report_file: sweep_report.md

limits:
  # Cumulative rate-limit sleep per run; after this, stop and skip the
  # remaining repos rather than burn the whole Actions job waiting.
  max_total_backoff_seconds: 300
  # Cap on total GitHub API calls for a single poll/sweep run. null = no cap.
  # Sweep mode calls comments+timeline per open issue, so for a repo with
  # hundreds of open issues this adds up fast - set it there if needed.
  max_api_calls_per_run: null

poll:
  # A repo's first-ever poll has no last_seen. Without this, it would fetch
  # every historical open issue and flood you - that's sweep's job. Instead
  # the first run only looks back this many days.
  first_run_window_days: 3

sweep:
  # In the sweep report, a kept issue with no maintainer-reviewer comment
  # AND no activity for at least this many days gets split into a separate
  # "Old / unanswered" section at the bottom instead of the main table.
  very_old_days_threshold: 180

digest:
  # Once a day, poll sends one Telegram message listing every issue newly
  # CREATED in the last 24h across all repos - including ones it skipped
  # (AUTHOR-CLAIMED, COMMENT-CLAIMED, HAS-PR, CLAIMED...) and repos with
  # nothing new - so silence never hides whether the radar ran at all.
  # Checked on every poll run rather than its own cron: GitHub's scheduler
  # has shown multi-hour drift on this repo, so a fixed "9 PM IST" trigger
  # would often just get skipped. This fires once interval_hours have
  # passed since the last digest, whenever poll next happens to run.
  enabled: true
  interval_hours: 23
